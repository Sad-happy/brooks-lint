name: Brooks-Lint PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  brooks-lint:
    name: Code Quality Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write   # required to post PR comments
      # security-events: write  # uncomment to upload SARIF to Code Scanning (sarif-file)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git diff main...HEAD

      # Pin to a release tag. `@main` would silently re-point at unreviewed
      # changes on every run — including the Anthropic SDK version the action
      # installs. Bump this deliberately.
      - uses: hyhmrright/brooks-lint/.github/actions/brooks-lint@v1.4.3
        with:
          mode: review
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          fail-below: 70  # fail the check if Health Score drops below 70
          # fail-on: critical            # fail on any Critical finding (none | warning | critical)
          # fail-on-regression: true     # fail if the Health Score dropped vs the last run
          # sarif-file: brooks-lint.sarif  # also upload findings to GitHub Code Scanning
          # api-base-url: https://your-gateway.example.com  # any Anthropic-compatible /v1/messages endpoint

      # Claude on Amazon Bedrock. Bedrock serves the Anthropic Messages API
      # natively and takes the same `x-api-key` the SDK already sends, so the
      # inputs above are the whole integration. Add `id-token: write` to the
      # permissions block, assume a role, mint a short-term Bedrock API key,
      # mask it, and hand it to the action in place of the secret:
      #
      # - uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::111122223333:role/brooks-lint-bedrock
      #     aws-region: us-east-1
      # - id: bedrock
      #   working-directory: ${{ runner.temp }}
      #   shell: bash
      #   run: |
      #     npm install --no-save @aws/bedrock-token-generator
      #     token=$(node --input-type=module -e '
      #       import { getTokenProvider } from "@aws/bedrock-token-generator";
      #       const provideToken = getTokenProvider();
      #       process.stdout.write(await provideToken());
      #     ')
      #     echo "::add-mask::$token"
      #     echo "token=$token" >> "$GITHUB_OUTPUT"
      # - uses: hyhmrright/brooks-lint/.github/actions/brooks-lint@v1.4.3
      #   with:
      #     mode: review
      #     api-base-url: https://bedrock-runtime.us-east-1.amazonaws.com/anthropic
      #     anthropic-api-key: ${{ steps.bedrock.outputs.token }}
      #     model: global.anthropic.claude-sonnet-5
      #
      # `bedrock-mantle` is the other endpoint:
      # https://bedrock-mantle.{region}.api.aws/anthropic — AWS recommends
      # bedrock-runtime for new applications. A forked `pull_request` run gets
      # neither repository secrets nor `id-token: write`, so this path cannot
      # review fork PRs. See the README section "Claude on Amazon Bedrock".
